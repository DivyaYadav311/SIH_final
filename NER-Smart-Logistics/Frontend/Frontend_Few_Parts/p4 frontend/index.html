<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>P5 Logistics Dashboard</title><link rel="stylesheet" href="src/styles.css"></head>
<body>
<header><div><h1>NER Smart Logistics</h1><p>P5 — Logistics & Supply Chain MVP</p></div><span id="health">Checking API…</span></header>
<main>
<section class="grid">
<article><h2>Shipment Management</h2><form id="shipmentForm">
<label>Shipment ID<input name="shipment_id" value="SHIP_1001"></label><label>Origin<input name="origin" value="Guwahati"></label><label>Destination<input name="destination" value="Tawang"></label><label>Cargo Type<input name="cargo_type" value="MEDICINE"></label><label>Quantity<input name="quantity" type="number" value="500"></label><label>Unit<input name="unit" value="BOX"></label><label>Priority<select name="priority"><option>CRITICAL</option><option>HIGH</option><option>NORMAL</option><option>LOW</option></select></label><label>Requested Delivery<input name="requested_delivery" value="2026-09-05T12:00:00Z"></label><label>Route ID<input name="route_id" value="ROUTE_501"></label><label>Travel Time (min)<input name="travel_time" type="number" value="792"></label><label>Route Risk<input name="route_risk" type="number" step="0.01" min="0" max="1" value="0.21"></label><button>Evaluate Shipment</button></form><pre id="shipmentResult"></pre></article>
<article><h2>Supply Shortage</h2><form id="shortageForm">
<label>District ID<input name="district_id" value="DIST_001"></label><label>District Name<input name="district_name" value="Tawang"></label><label>Product Type<input name="product_type" value="MEDICINE"></label><label>Current Inventory<input name="inventory" type="number" value="450"></label><label>Daily Consumption<input name="consumption" type="number" value="150"></label><label>Incoming Quantity<input name="incoming" type="number" value="500"></label><label>Incoming ETA (days)<input name="incoming_eta" type="number" step="0.1" value="4"></label><label>Road Risk<input name="road_risk" type="number" step="0.01" min="0" max="1" value="0.82"></label><label>Population<input name="population" type="number" value="55000"></label><button>Predict Shortage</button></form><pre id="shortageResult"></pre></article>
<article><h2>Warehouse Optimization</h2><form id="warehouseForm"><label>Product Type<input name="product_type" value="MEDICINE"></label><label>Demand Units<input name="demand" type="number" value="1000"></label><label>Shortage Probability<input name="probability" type="number" step="0.01" value="0.91"></label><label>Warehouse 1 ID<input name="wh1" value="WH_001"></label><label>Warehouse 1 Location<input name="loc1" value="Guwahati"></label><label>Warehouse 1 Units<input name="units1" type="number" value="5000"></label><label>Warehouse 2 ID<input name="wh2" value="WH_002"></label><label>Warehouse 2 Location<input name="loc2" value="Tezpur"></label><label>Warehouse 2 Units<input name="units2" type="number" value="1800"></label><button>Optimize Allocation</button></form><pre id="warehouseResult"></pre></article>
</section>
<section><h2>Recent Shipments</h2><button id="refresh">Refresh</button><table><thead><tr><th>ID</th><th>Priority</th><th>Route</th><th>Risk</th><th>Status</th><th>ETA</th></tr></thead><tbody id="shipments"></tbody></table></section>
</main><script src="src/app.js"></script></body></html>
